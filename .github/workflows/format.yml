name: Formatting

on:
  pull_request:
    branches:
      - main
      - master
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  dotnet-format:
    name: Check C# Formatting
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore loader
        run: dotnet restore loclm-csharp/loclm-csharp.csproj

      - name: Check loader formatting
        run: dotnet format loclm-csharp/loclm-csharp.csproj --verify-no-changes --no-restore --include loclm-csharp

      - name: Restore mod template
        run: dotnet restore mod_template/CreatureProbe.csproj

      - name: Check mod template formatting
        run: dotnet format mod_template/CreatureProbe.csproj --verify-no-changes --no-restore --include mod_template
