name: Build Release Zip

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build Windows Release Zip
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build release zip
        shell: pwsh
        run: .\scripts\build-release.ps1 -Configuration Release -ZipName LOCLM-Windows-x64.zip

      - name: Upload release zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: LOCLM-Windows-x64
          path: |
            dist/LOCLM-Windows-x64.zip
            dist/checksums.txt
